alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: node4
    securityContext:
      fsGroup: 2000
      runAsGroup: 2000
      runAsUser: 114
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: local-path
grafana:
  enabled: true
  grafana.ini:
    metrics:
      enabled: true
  initChownData:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: node3
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClassName: local-path
  podSecurityContext:
    fsGroup: 472
    runAsUser: 472
  replicas: 1
  service:
    port: 80
    portName: http-web
    targetPort: 3000
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
    path: /metrics
    scheme: http
    scrapeTimeout: 30s
prometheus:
  prometheusSpec:
    additionalScrapeConfigs: "- job_name: 'webrtc'\n  scrape_interval: 15s\n  scheme:
      https\n  static_configs:\n    - targets: ['10.0.0.12:5000']\n      labels:\n
      \       app_environment: 'external-vm'\n        app_name: 'WebRTC'\n  tls_config:\n
      \   insecure_skip_verify: true\n# *** NEW: Spiritist Books Backend Job ***\n-
      job_name: 'spiritist-books-backend'\n  scrape_interval: 15s\n  # Scheme defaults
      to 'http' if not specified, but setting it explicitly is good practice\n  scheme:
      http\n  static_configs:\n    - targets: ['10.0.0.11:3000'] \n      labels:\n
      \       app_environment: 'external-vm'\n        app_name: 'Spiritist-Books-Backend'\n"
    nodeSelector:
      kubernetes.io/hostname: node4
    securityContext:
      allowPrivilegeEscalation: false
      fsGroup: 119
      runAsGroup: 119
      runAsUser: 114
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: local-path
