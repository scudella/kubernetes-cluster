apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: spiritist-books
  labels:
    app: spiritist-books
    component: frontend
spec:
  replicas: 4

  selector:
    matchLabels:
      app: spiritist-books
      component: frontend

  template:
    metadata:
      labels:
        app: spiritist-books
        component: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - frontend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: frontend
        image: scudella/spiritist:v4.9.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80

