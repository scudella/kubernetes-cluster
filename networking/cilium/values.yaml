bpf:
  masquerade: true
cni:
  exclusive: true
dashboards:
  enabled: true
devices: enp+ eth+ wg+
egressMasqueradeInterfaces: ""
endpointPolicyUpdateTimeoutDuration: "15s"
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv4PodCIDRList:
    - 10.32.0.0/12
k8sServiceHost: 10.0.0.11
k8sServicePort: 6443
kubeProxyReplacement: true
mtu: 1360
operator:
  prometheus:
    enabled: true
  replicas: 1
prometheus:
  enabled: true
rollOutCiliumPods: true
routingMode: tunnel
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE
tunnelProtocol: vxlan
upgradeCompatibility: "1.20"
